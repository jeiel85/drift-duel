<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0a1f" />
    <title>Drift Duel — Play</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="stylesheet" href="./src/play.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>
    <canvas id="speed-fx" hidden aria-hidden="true"></canvas>
    <div id="touch" aria-hidden="true">
      <div class="zone left"><span>◀</span></div>
      <div class="zone right"><span>▶</span></div>
    </div>

    <div id="hud" hidden>
      <div class="hud-top">
        <div class="pill"><small>POS</small><b id="hud-pos">1/2</b></div>
        <div class="pill"><small>LAP</small><b id="hud-lap">1/3</b></div>
        <div class="pill"><small>TIME</small><b id="hud-time">0:00.00</b></div>
        <button class="icon-btn" id="btn-pause" aria-label="Pause" data-i18n-attr="aria-label:aria.pause">⏸</button>
      </div>
      <div id="hud-gap" class="gap"></div>
      <div id="drift-pop" class="drift-pop"></div>
      <div id="boost-pop" class="boost-pop"></div>
      <div class="hud-bottom">
        <div class="speedo"><b id="hud-speed">0</b><small>km/h</small></div>
        <button id="btn-nitro" class="nitro" aria-label="Nitro" data-i18n-attr="aria-label:aria.nitro">
          <span class="nitro-fill" id="nitro-fill"></span>
          <span class="nitro-label">NITRO<small data-i18n="hud.nitroHint"></small></span>
        </button>
        <div class="score"><small>DRIFT</small><b id="hud-drift">0</b></div>
      </div>
    </div>

    <div id="countdown" class="countdown" hidden></div>

    <div id="touch-guide" class="touch-guide" hidden aria-hidden="true">
      <div class="g-left"><b>◀</b><span data-i18n="guide.left"></span><small data-i18n="guide.tap"></small></div>
      <div class="g-right"><b>▶</b><span data-i18n="guide.right"></span><small data-i18n="guide.tap"></small></div>
      <div class="g-mid"><b>↑</b><span data-i18n="guide.nitro"></span><small data-i18n="guide.more"></small></div>
    </div>

    <section id="menu" class="overlay">
      <div class="panel">
        <header class="brand">
          <span class="logo">DRIFT<i>DUEL</i></span>
          <button class="lang-btn" id="btn-lang" type="button" data-i18n="menu.lang" data-i18n-attr="aria-label:aria.lang"></button>
          <button class="icon-btn" id="btn-mute" aria-label="Sound on/off" data-i18n-attr="aria-label:aria.mute">🔊</button>
        </header>
        <h2 data-i18n="menu.track"></h2>
        <div class="cards" id="track-list"></div>
        <h2 class="full-only" data-i18n="menu.car"></h2>
        <div class="cards cars full-only" id="car-list"></div>
        <h2 class="full-only" data-i18n="menu.skill"></h2>
        <div class="segmented full-only" id="skill-list"></div>
        <div class="toggles full-only">
          <button class="toggle" id="opt-assist" type="button" aria-pressed="true">
            <b data-i18n="menu.assist"></b><small data-i18n="menu.assistSub"></small>
          </button>
          <button class="toggle" id="opt-haptics" type="button" aria-pressed="true">
            <b data-i18n="menu.haptics"></b><small data-i18n="menu.hapticsSub"></small>
          </button>
        </div>
        <button class="cta" id="btn-start" data-i18n="menu.start"></button>
        <p class="hint" id="controls-hint"></p>
        <a class="back" id="link-about" href="./" data-i18n="menu.back"></a>
      </div>
    </section>

    <section id="pause" class="overlay" hidden>
      <div class="panel small">
        <h1 data-i18n="pause.title"></h1>
        <button class="cta" id="btn-resume" data-i18n="pause.resume"></button>
        <button class="ghost" id="btn-restart" data-i18n="pause.restart"></button>
        <button class="ghost" id="btn-quit" data-i18n="toMenu"></button>
      </div>
    </section>

    <section id="results" class="overlay" hidden>
      <div class="panel small">
        <h1 id="res-title"></h1>
        <p class="res-sub" id="res-sub"></p>
        <dl class="stats">
          <div><dt data-i18n="res.time"></dt><dd id="res-time"></dd></div>
          <div><dt data-i18n="res.lap"></dt><dd id="res-lap"></dd></div>
          <div><dt data-i18n="res.drift"></dt><dd id="res-drift"></dd></div>
          <div><dt data-i18n="res.combo"></dt><dd id="res-combo"></dd></div>
        </dl>
        <p class="badge" id="res-badge" hidden></p>
        <button class="cta" id="btn-again" data-i18n="res.again"></button>
        <button class="ghost" id="btn-menu" data-i18n="toMenu"></button>
      </div>
    </section>

    <div id="gl-lost" class="overlay" hidden>
      <div class="panel small">
        <h1 data-i18n="gl.title"></h1>
        <p class="res-sub" data-i18n="gl.msg"></p>
        <button class="ghost" id="btn-gl-reload" type="button" data-i18n="gl.reload" hidden></button>
      </div>
    </div>

    <div id="error" class="overlay" hidden>
      <div class="panel small">
        <h1 id="error-title" data-i18n="err.title"></h1>
        <p class="res-sub" id="error-msg"></p>
        <button class="cta" id="btn-reload" type="button" data-i18n="err.restart"></button>
        <a class="ghost" id="btn-report" href="#" target="_blank" rel="noopener" data-i18n="err.report"></a>
        <p class="hint" data-i18n="err.reportNote"></p>
      </div>
    </div>

    <script type="module" src="./src/play.js"></script>
  </body>
</html>
