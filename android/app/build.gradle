apply plugin: 'com.android.application'

// Release signing. Local builds read <repo>/.keystore/release-signing.properties
// (git-ignored); CI passes the same keystore through ANDROID_KEYSTORE_* env vars
// decoded from GitHub secrets. Without either, release builds stop with an error
// instead of producing an unsigned APK.
def releaseSigning = [:]
def signingFile = rootProject.file('../.keystore/release-signing.properties')
if (System.getenv('ANDROID_KEYSTORE_PATH')) {
    releaseSigning = [
        storeFile    : file(System.getenv('ANDROID_KEYSTORE_PATH')),
        storePassword: System.getenv('ANDROID_KEYSTORE_PASSWORD'),
        keyAlias     : System.getenv('ANDROID_KEY_ALIAS'),
        keyPassword  : System.getenv('ANDROID_KEY_PASSWORD'),
    ]
} else if (signingFile.exists()) {
    def props = new Properties()
    signingFile.withInputStream { props.load(it) }
    releaseSigning = [
        storeFile    : new File(signingFile.parentFile, props.getProperty('keystorePath')),
        storePassword: props.getProperty('storePassword'),
        keyAlias     : props.getProperty('keyAlias'),
        keyPassword  : props.getProperty('keyPassword'),
    ]
}

android {
    namespace = "io.github.jeiel85.driftduel"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.jeiel85.driftduel"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "0.3.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseSigning) {
                storeFile releaseSigning.storeFile
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }
    buildTypes {
        release {
            signingConfig releaseSigning ? signingConfigs.release : null
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// Fail fast if someone builds a release without signing set up.
gradle.taskGraph.whenReady { graph ->
    def wantsRelease = graph.allTasks.any { it.name in ['assembleRelease', 'bundleRelease'] }
    if (wantsRelease && !releaseSigning) {
        throw new GradleException("Release signing is not configured: add .keystore/release-signing.properties or set ANDROID_KEYSTORE_PATH/ANDROID_KEYSTORE_PASSWORD/ANDROID_KEY_ALIAS/ANDROID_KEY_PASSWORD.")
    }
    if (wantsRelease && !releaseSigning.storeFile.exists()) {
        throw new GradleException("Release keystore not found: ${releaseSigning.storeFile}")
    }
}
