name: Android APK

# Builds the Capacitor Android app signed with the release (upload) keystore.
# The keystore lives outside git; CI gets it from repository secrets:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Every run uploads the APK/AAB as artifacts; a version tag (v*) also attaches
# them to that GitHub release as drift-duel.apk / drift-duel.aab, which the
# landing page links to via releases/latest.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # SHA-256 of the release certificate (public). Builds signed with any other key fail.
  EXPECTED_CERT_SHA256: 6c1f643a17c473465cef76fe4ec2dd58220e593ce5f57fe67e3e279d2769cedf

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm test
      - name: Build web bundle and sync into the Android project
        run: npm run android:sync

      - name: Restore release keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Missing repository secret for $v"; exit 1; fi
          done
          trim() { printf '%s' "$1" | tr -d '\r\n'; }
          echo "::add-mask::$(trim "$STORE_PASSWORD")"
          echo "::add-mask::$(trim "$KEY_PASSWORD")"
          trim "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$(trim "$STORE_PASSWORD")"
            echo "ANDROID_KEY_ALIAS=$(trim "$KEY_ALIAS")"
            echo "ANDROID_KEY_PASSWORD=$(trim "$KEY_PASSWORD")"
          } >> "$GITHUB_ENV"

      - name: Assemble signed APK and AAB
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Verify the APK is signed with the release key
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          ACTUAL=$("$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          echo "certificate SHA-256: $ACTUAL"
          [ "$ACTUAL" = "$EXPECTED_CERT_SHA256" ] || { echo "::error::APK signed with an unexpected certificate"; exit 1; }

      - name: Collect outputs
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk drift-duel.apk
          cp android/app/build/outputs/bundle/release/app-release.aab drift-duel.aab
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v7
        with:
          name: drift-duel-android
          path: |
            drift-duel.apk
            drift-duel.aab
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Automated release for $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" drift-duel.apk drift-duel.aab --clobber
